[project]
name = "personal-health-rag"
version = "0.1.0"
description = "Local-first health document RAG proof of concept using ADK, LangChain, and LangGraph."
requires-python = ">=3.11"
dependencies = [
  "google-adk>=1.17,<2",
  "langchain>=1.0,<2",
  "langchain-google-genai>=4.0,<5",
  "langchain-text-splitters>=1.0,<2",
  "langgraph>=1.0,<2",
  "pydantic>=2.10,<3",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "python-multipart>=0.0.20,<1",
  "PyJWT>=2.10,<3",
  "pwdlib[argon2]>=0.2,<1",
  "email-validator>=2.2,<3",
  "faiss-cpu>=1.10,<2",
  "grandalf>=0.8,<1",
  "numpy>=2.0,<3",
  "httpx>=0.28,<1",
  "pypdf>=5.0,<7",
  "pypdfium2>=4.30,<5",
  "python-docx>=1.1,<2",
  "Pillow>=10,<13",
  "python-dotenv>=1.0,<2",
]

[project.scripts]
health-rag = "health_rag.server:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["health_rag*"]

[tool.setuptools.package-data]
health_rag = ["static/*.html", "static/*.js"]
